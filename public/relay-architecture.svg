<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RELAY WebMCP architecture</title>
  <desc id="desc">One human move intent flows through a RELAY policy and orchestration layer to seven fictional services, an exact human approval gate, action receipts, and safety refusal proof.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f17"/><stop offset="1" stop-color="#0c3425"/></linearGradient>
    <linearGradient id="relay" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f6b49"/><stop offset="1" stop-color="#159260"/></linearGradient>
    <linearGradient id="proof" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#eaf7ee"/><stop offset="1" stop-color="#f8fbf9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00130c" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b9ff45"/></marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:15px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase}.small{font-size:17px}.body{font-size:20px}.label{font-size:22px;font-weight:750}.card{fill:#fff;stroke:#dce8e0;stroke-width:2}.muted{fill:#708078}.green{fill:#0d6847}.lime{fill:#b9ff45}.line{fill:none;stroke:#b9ff45;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1450" cy="-40" r="330" fill="none" stroke="#b9ff45" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="1450" cy="-40" r="230" fill="none" stroke="#b9ff45" stroke-opacity=".08" stroke-width="2"/>

  <g class="sans">
    <rect x="62" y="52" width="54" height="54" rx="15" fill="#b9ff45"/><text x="89" y="88" text-anchor="middle" font-size="24" font-weight="900" fill="#082218">R</text>
    <text x="136" y="88" font-size="28" font-weight="850" fill="#fff" letter-spacing="2">RELAY</text>
    <text x="62" y="151" font-size="48" font-weight="760" fill="#fff" letter-spacing="-1.5">One intent. Many websites.</text>
    <text x="62" y="187" class="body" fill="#b6c8be">Safe cross-service delegation through structured WebMCP tools.</text>

    <g filter="url(#shadow)">
      <rect x="62" y="242" width="310" height="208" rx="25" fill="#f8fbf9"/>
      <rect x="86" y="266" width="48" height="48" rx="14" fill="#e4f4e9"/><path d="M101 292h18m-9-9v18" stroke="#157950" stroke-width="3" stroke-linecap="round"/>
      <text x="86" y="346" class="eyebrow green">Human intent</text>
      <text x="86" y="383" class="label" fill="#20372c">“Move my home</text>
      <text x="86" y="413" class="label" fill="#20372c">services safely.”</text>
      <text x="86" y="437" class="small muted">One date · one address · one policy</text>
    </g>

    <path class="line" d="M372 346 H466"/>

    <g filter="url(#shadow)">
      <rect x="472" y="222" width="566" height="248" rx="29" fill="url(#relay)" stroke="#58bb84" stroke-width="2"/>
      <text x="506" y="264" class="eyebrow lime">RELAY coordination layer</text>
      <text x="506" y="311" font-size="31" font-weight="760" fill="#fff">Intent → rules → scoped action → proof</text>
      <g transform="translate(506 340)">
        <rect width="148" height="86" rx="16" fill="#ffffff14" stroke="#ffffff26"/><text x="18" y="31" class="small" fill="#b9ff45">01 · POLICY</text><text x="18" y="60" class="small" fill="#fff">Allow / ask / deny</text>
        <rect x="164" width="148" height="86" rx="16" fill="#ffffff14" stroke="#ffffff26"/><text x="182" y="31" class="small" fill="#b9ff45">02 · TOOLS</text><text x="182" y="60" class="small" fill="#fff">Preview → commit</text>
        <rect x="328" width="194" height="86" rx="16" fill="#ffffff14" stroke="#ffffff26"/><text x="346" y="31" class="small" fill="#b9ff45">03 · LEDGER</text><text x="346" y="60" class="small" fill="#fff">Receipts / refusals</text>
      </g>
    </g>

    <path class="line" d="M1038 346 H1120"/>

    <g filter="url(#shadow)">
      <rect x="1126" y="242" width="410" height="208" rx="25" fill="#fff8ed" stroke="#f0d09b" stroke-width="2"/>
      <rect x="1152" y="268" width="48" height="48" rx="14" fill="#ffe9c9"/><path d="M1165 288h22v17h-22z M1170 288v-5a6 6 0 0 1 12 0v5" fill="none" stroke="#a56618" stroke-width="2.5"/>
      <text x="1218" y="290" class="eyebrow" fill="#a56618">Human checkpoint</text>
      <text x="1152" y="348" class="label" fill="#5e431f">Exact single-use grant</text>
      <text x="1152" y="382" class="small" fill="#80684a">Provider · action · plan · price · date</text>
      <text x="1152" y="413" class="mono" font-size="16" fill="#8d652f">GRT-WAV-300-0915 · 10 MIN · 1 USE</text>
    </g>

    <text x="62" y="522" class="eyebrow" fill="#b9ff45">27 structured WebMCP tools</text>
    <g transform="translate(62 546)" filter="url(#shadow)">
      <g><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#e5f3ea"/><text x="53" y="38" class="label" fill="#20372c">Civic</text><text x="24" y="76" class="small muted">Council address</text></g>
      <g transform="translate(210)"><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#fff0dc"/><text x="53" y="38" class="label" fill="#20372c">Northstar</text><text x="24" y="76" class="small muted">Energy transfer</text></g>
      <g transform="translate(420)"><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#e5f2f7"/><text x="53" y="38" class="label" fill="#20372c">Clearflow</text><text x="24" y="76" class="small muted">Water account</text></g>
      <g transform="translate(630)"><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#f8e6e6"/><text x="53" y="38" class="label" fill="#20372c">Postway</text><text x="24" y="76" class="small muted">Mail forwarding</text></g>
      <g transform="translate(840)"><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#eeeaf7"/><text x="53" y="38" class="label" fill="#20372c">Haven</text><text x="24" y="76" class="small muted">Home insurance</text></g>
      <g transform="translate(1050)"><rect class="card" width="194" height="108" rx="19"/><circle cx="30" cy="31" r="13" fill="#e8edfb"/><text x="53" y="38" class="label" fill="#20372c">Wavelength</text><text x="24" y="76" class="small muted">Internet plan</text></g>
      <g transform="translate(1260)"><rect width="194" height="108" rx="19" fill="#f1f3f2" stroke="#d9dfdc" stroke-width="2"/><circle cx="30" cy="31" r="13" fill="#e2e6e4"/><text x="53" y="38" class="label" fill="#66736c">Hearth</text><text x="24" y="76" class="small" fill="#8a948f">Blocked by policy</text></g>
    </g>

    <g transform="translate(62 698)" filter="url(#shadow)">
      <rect width="1474" height="142" rx="25" fill="url(#proof)" stroke="#cfe1d5" stroke-width="2"/>
      <text x="28" y="40" class="eyebrow green">Verifiable outcomes</text>
      <g transform="translate(28 59)"><rect width="430" height="58" rx="14" fill="#e4f3e9"/><text x="20" y="25" class="small" font-weight="750" fill="#276d4b">ACTION RECEIPTS</text><text x="20" y="46" class="small" fill="#557264">Six allowed provider mutations</text></g>
      <g transform="translate(480 59)"><rect width="430" height="58" rx="14" fill="#fff1e0"/><text x="20" y="25" class="small" font-weight="750" fill="#986019">APPROVAL PROOF</text><text x="20" y="46" class="small" fill="#806b4d">Exact grant consumed once</text></g>
      <g transform="translate(932 59)"><rect width="514" height="58" rx="14" fill="#f5eaea"/><text x="20" y="25" class="small" font-weight="750" fill="#8d4d4d">REFUSAL PROOF</text><text x="20" y="46" class="small" fill="#7a6666">Five unsafe requests · no provider change</text></g>
    </g>
  </g>
</svg>
